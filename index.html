<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hội thảo An toàn thông tin 2026</title>
        <meta name="theme-color" content="#07111f" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
            rel="stylesheet"
        />

        <!-- Bootstrap 5 + Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />

        <!-- Font Awesome (optional, nhưng Bootstrap Icons đủ dùng) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

        <!-- AOS Animation -->
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/sections/header.css" />
        <link rel="stylesheet" href="css/sections/hero.css" />
        <link rel="stylesheet" href="css/sections/overview.css" />
        <link rel="stylesheet" href="css/sections/threats.css" />
        <link rel="stylesheet" href="css/sections/solutions.css" />
        <link rel="stylesheet" href="css/sections/models.css" />
        <link rel="stylesheet" href="css/sections/deployment.css" />
        <link rel="stylesheet" href="css/sections/speakers.css" />
        <link rel="stylesheet" href="css/sections/stats.css" />
        <link rel="stylesheet" href="css/sections/registration.css" />
        <link rel="stylesheet" href="css/sections/faq.css" />
        <link rel="stylesheet" href="css/sections/footer.css" />
    </head>
    <body>
        <div id="pageIntro" class="page-intro" aria-live="polite" aria-busy="true">
            <!-- Container Three.js -->
            <div id="three-container" class="page-intro__three"></div>

            <!-- Nội dung chính (sẽ được điều khiển bằng class) -->
            <div class="page-intro__shell" id="introShell">
                <!-- Logo – sẽ di chuyển lên trên -->
                <img
                    src="https://unicorp.com.vn/wp-content/uploads/2026/04/uni-logo-only-mini.png"
                    alt="Logo UNI"
                    class="page-intro__logo"
                    onload="this.nextElementSibling.hidden = true"
                    onerror="
                        this.hidden = true;
                        this.nextElementSibling.hidden = false;
                    "
                />
                <span class="page-intro__logo-fallback" hidden>UNI</span>

                <!-- Thông tin hội thảo – sẽ xuất hiện sau -->
                <div class="page-intro__brand-copy" id="brandCopy">
                    <span class="page-intro__eyebrow">CÔNG TY CỔ PHẦN UNI</span>
                    <h1>Chào Mừng Đến Với</h1>
                    <h1>Hội Thảo An Toàn Thông Tin</h1>
                    <!-- <h1>2026</h1> -->
                    <p>
                        Sự kiện do Sở Khoa Học &amp; Công Nghệ Tỉnh Lâm Đồng phối hợp cùng Công ty Cổ phần UNI đồng hành
                        tổ chức.
                    </p>
                </div>
            </div>
        </div>

        <!-- Các container sẽ được load nội dung từ sections -->
        <div id="header"></div>
        <main>
            <div id="hero"></div>
            <div id="overview"></div>
            <div id="threats"></div>
            <div id="solutions"></div>
            <div id="models"></div>
            <div id="deployment"></div>
            <div id="speakers"></div>
            <div id="stats"></div>
            <div id="registration"></div>
            <div id="faq"></div>
        </main>
        <div id="footer"></div>

        <!-- JavaScript dependencies -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <!-- Thư viện CountUp (cho hiệu ứng số) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.8.0/countUp.umd.js"></script>

        <!-- Main JS để load sections và khởi tạo -->
        <script src="js/main.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script>
            (function () {
                const container = document.getElementById("three-container");
                if (!container) return;

                // ---- Scene, Camera, Renderer ----
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x050b14);

                const camera = new THREE.PerspectiveCamera(
                    60,
                    container.clientWidth / container.clientHeight,
                    0.1,
                    1000,
                );
                camera.position.set(0, 0.6, 9);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = false;
                container.appendChild(renderer.domElement);

                // ---- Ánh sáng ----
                const ambient = new THREE.AmbientLight(0x223355);
                scene.add(ambient);

                const keyLight = new THREE.DirectionalLight(0x66ddff, 1.0);
                keyLight.position.set(3, 4, 5);
                scene.add(keyLight);

                const backLight = new THREE.DirectionalLight(0xff66aa, 0.4);
                backLight.position.set(-2, -1, -6);
                scene.add(backLight);

                const fillLight = new THREE.DirectionalLight(0x44aaff, 0.6);
                fillLight.position.set(-1, 2, 3);
                scene.add(fillLight);

                // ---- Lưới nền tĩnh ----
                const gridHelper = new THREE.GridHelper(15, 30, 0x44aaff, 0x225588);
                gridHelper.position.y = -2.5;
                gridHelper.material.transparent = true;
                gridHelper.material.opacity = 0.15;
                scene.add(gridHelper);

                // ---- Các điểm sáng nền (ma trận) ----
                const gridPointCount = 600;
                const gpPos = new Float32Array(gridPointCount * 3);
                for (let i = 0; i < gridPointCount; i++) {
                    gpPos[i * 3] = (Math.random() - 0.5) * 12;
                    gpPos[i * 3 + 1] = (Math.random() - 0.5) * 8 - 0.5;
                    gpPos[i * 3 + 2] = (Math.random() - 0.5) * 6 - 2;
                }
                const gpGeo = new THREE.BufferGeometry();
                gpGeo.setAttribute("position", new THREE.BufferAttribute(gpPos, 3));
                const gpMat = new THREE.PointsMaterial({
                    color: 0x4488ff,
                    size: 0.03,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending,
                });
                const gridPoints = new THREE.Points(gpGeo, gpMat);
                scene.add(gridPoints);

                // ================================================================
                //  VÒNG TRÒN VÀ ỐNG XOẮN – TẠO CÁC "LINE" CHẠY VÒNG
                // ================================================================

                // Ring 1 – chính
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0x44ddff,
                    emissive: 0x0066aa,
                    emissiveIntensity: 0.8,
                    metalness: 0.9,
                    roughness: 0.1,
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide,
                });
                const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.04, 32, 80), ringMat);
                ring.rotation.x = Math.PI / 2.4;
                ring.rotation.z = 0.2;
                scene.add(ring);

                // Ring 2 – màu cam
                const ringMat2 = new THREE.MeshStandardMaterial({
                    color: 0xff8844,
                    emissive: 0x663300,
                    emissiveIntensity: 0.5,
                    metalness: 0.6,
                    roughness: 0.3,
                    transparent: true,
                    opacity: 0.5,
                    side: THREE.DoubleSide,
                });
                const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.03, 24, 60), ringMat2);
                ring2.rotation.x = Math.PI / 2.0;
                ring2.rotation.z = -0.6;
                scene.add(ring2);

                // Ring 3 – tím (wireframe)
                const ringMat3 = new THREE.MeshStandardMaterial({
                    color: 0xcc66ff,
                    emissive: 0x440066,
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.2,
                    wireframe: true,
                });
                const ring3 = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.03, 16, 60), ringMat3);
                ring3.rotation.x = Math.PI / 1.8;
                ring3.rotation.z = 0.9;
                scene.add(ring3);

                // Ống xoắn 1
                const spiralPoints = [];
                const turns = 3;
                const radius = 2.4;
                const height = 1.2;
                const segments = 200;
                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const angle = t * Math.PI * 2 * turns;
                    const x = radius * Math.cos(angle) * (1 + 0.1 * Math.sin(t * Math.PI * 4));
                    const y = radius * Math.sin(angle) * (1 + 0.1 * Math.cos(t * Math.PI * 3));
                    const z = (t - 0.5) * height;
                    spiralPoints.push(new THREE.Vector3(x, y, z));
                }
                const spiralCurve = new THREE.CatmullRomCurve3(spiralPoints);
                const tubeGeo = new THREE.TubeGeometry(spiralCurve, 200, 0.025, 8, false);
                const tubeMat = new THREE.MeshStandardMaterial({
                    color: 0x66ddff,
                    emissive: 0x004488,
                    emissiveIntensity: 0.6,
                    transparent: true,
                    opacity: 0.35,
                    side: THREE.DoubleSide,
                });
                const tube = new THREE.Mesh(tubeGeo, tubeMat);
                scene.add(tube);

                // Ống xoắn 2 – ngược chiều
                const spiralPoints2 = [];
                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const angle = -t * Math.PI * 2 * turns + 0.5;
                    const x = (radius - 0.4) * Math.cos(angle) * (1 + 0.08 * Math.sin(t * Math.PI * 5));
                    const y = (radius - 0.4) * Math.sin(angle) * (1 + 0.08 * Math.cos(t * Math.PI * 4));
                    const z = (t - 0.5) * height * 0.8;
                    spiralPoints2.push(new THREE.Vector3(x, y, z));
                }
                const spiralCurve2 = new THREE.CatmullRomCurve3(spiralPoints2);
                const tubeGeo2 = new THREE.TubeGeometry(spiralCurve2, 200, 0.015, 6, false);
                const tubeMat2 = new THREE.MeshStandardMaterial({
                    color: 0xff88aa,
                    emissive: 0x550033,
                    emissiveIntensity: 0.4,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.DoubleSide,
                });
                const tube2 = new THREE.Mesh(tubeGeo2, tubeMat2);
                scene.add(tube2);

                // ================================================================
                //  HỆ THỐNG HẠT – HỘI TỤ VÀO TRUNG TÂM
                // ================================================================

                const particleCount = 3500;
                const posArray = new Float32Array(particleCount * 3);
                const colorArray = new Float32Array(particleCount * 3);
                const particleData = [];

                // Mỗi hạt có: phase góc, tốc độ góc, độ cao ban đầu, chu kỳ sống
                for (let i = 0; i < particleCount; i++) {
                    // Bán kính tối đa khoảng 3.5, tối thiểu 0.2
                    const maxR = 2.8 + Math.random() * 1.2;
                    const angle = Math.random() * Math.PI * 2;
                    const height = (Math.random() - 0.5) * 2.0;
                    const speed = 0.2 + Math.random() * 0.4; // tốc độ quay
                    const phase = Math.random() * Math.PI * 2;
                    // Chu kỳ dao động bán kính: mỗi hạt có chu kỳ riêng
                    const cycleSpeed = 0.15 + Math.random() * 0.25;

                    posArray[i * 3] = maxR * Math.cos(angle);
                    posArray[i * 3 + 1] = maxR * Math.sin(angle);
                    posArray[i * 3 + 2] = height;

                    const color = new THREE.Color().setHSL(0.55 + Math.random() * 0.25, 0.9, 0.5 + Math.random() * 0.4);
                    colorArray[i * 3] = color.r;
                    colorArray[i * 3 + 1] = color.g;
                    colorArray[i * 3 + 2] = color.b;

                    particleData.push({
                        maxR,
                        angle,
                        height,
                        speed,
                        phase,
                        cycleSpeed,
                        offset: Math.random() * 100,
                    });
                }

                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute("position", new THREE.BufferAttribute(posArray, 3));
                particleGeo.setAttribute("color", new THREE.BufferAttribute(colorArray, 3));

                const particleMat = new THREE.PointsMaterial({
                    size: 0.07,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true,
                });
                const particleSystem = new THREE.Points(particleGeo, particleMat);
                scene.add(particleSystem);

                // ================================================================
                //  LOGO TRUNG TÂM
                // ================================================================

                const loader = new THREE.TextureLoader();
                const logoTex = loader.load("https://unicorp.com.vn/wp-content/uploads/2026/04/uni-logo-only-mini.png");
                const logoMat = new THREE.MeshStandardMaterial({
                    map: logoTex,
                    transparent: true,
                    side: THREE.DoubleSide,
                    emissive: new THREE.Color(0x44ddff),
                    emissiveIntensity: 0.4,
                });
                const logoMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0), logoMat);
                logoMesh.position.z = 0.6;
                scene.add(logoMesh);

                // ================================================================
                //  BEAM (TIA SÁNG)
                // ================================================================

                const beamCount = 120;
                const beamPos = new Float32Array(beamCount * 3);
                const beamData = [];
                for (let i = 0; i < beamCount; i++) {
                    const angle = (i / beamCount) * Math.PI * 2;
                    const r = 2.5 + Math.random() * 0.8;
                    const x = r * Math.cos(angle);
                    const y = r * Math.sin(angle);
                    beamPos[i * 3] = x;
                    beamPos[i * 3 + 1] = y;
                    beamPos[i * 3 + 2] = 0;
                    beamData.push({
                        start: new THREE.Vector3(x, y, 0),
                        end: new THREE.Vector3(0, 0, 0.6),
                        progress: Math.random(),
                        speed: 0.004 + Math.random() * 0.015,
                        delay: Math.random() * 100,
                    });
                }
                const beamGeo = new THREE.BufferGeometry();
                beamGeo.setAttribute("position", new THREE.BufferAttribute(beamPos, 3));
                const beamMat = new THREE.PointsMaterial({
                    size: 0.18,
                    color: 0x66ddff,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    opacity: 0.5,
                });
                const beamSystem = new THREE.Points(beamGeo, beamMat);
                scene.add(beamSystem);

                // ================================================================
                //  PARALLAX CHUỘT
                // ================================================================

                let mouseX = 0,
                    mouseY = 0;
                document.addEventListener("mousemove", (e) => {
                    const x = (e.clientX / window.innerWidth) * 2 - 1;
                    const y = -(e.clientY / window.innerHeight) * 2 + 1;
                    mouseX = x * 0.3;
                    mouseY = y * 0.15;
                });
                document.addEventListener("touchmove", (e) => {
                    if (e.touches.length) {
                        const x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                        const y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                        mouseX = x * 0.3;
                        mouseY = y * 0.15;
                    }
                });

                // ================================================================
                //  ANIMATION LOOP
                // ================================================================

                let time = 0;

                function animate() {
                    requestAnimationFrame(animate);
                    time += 0.012;

                    // Xoay các vòng
                    ring.rotation.y += 0.005;
                    ring.rotation.x += 0.001;
                    ring2.rotation.y -= 0.008;
                    ring2.rotation.x += 0.002;
                    ring3.rotation.y += 0.004;
                    ring3.rotation.z += 0.001;

                    // Xoay ống xoắn
                    tube.rotation.y += 0.002;
                    tube.rotation.x += 0.0005;
                    tube2.rotation.y -= 0.003;
                    tube2.rotation.x += 0.0005;

                    // Cập nhật hạt: bán kính thay đổi theo chu kỳ → hội tụ
                    const pos = particleSystem.geometry.attributes.position.array;
                    for (let i = 0; i < particleCount; i++) {
                        const d = particleData[i];
                        // Tính bán kính theo chu kỳ: từ maxR xuống 0.2 rồi lên lại
                        const cycle = Math.sin(time * d.cycleSpeed + d.phase) * 0.5 + 0.5; // 0..1
                        const currentR = 0.2 + (d.maxR - 0.2) * (1 - cycle); // 0.2..maxR
                        const angle = d.angle + time * d.speed;
                        const h = d.height + Math.sin(time * d.speed * 0.7 + d.phase) * 0.3;
                        pos[i * 3] = currentR * Math.cos(angle);
                        pos[i * 3 + 1] = currentR * Math.sin(angle);
                        pos[i * 3 + 2] = h * 0.8;
                    }
                    particleSystem.geometry.attributes.position.needsUpdate = true;

                    // Cập nhật beam
                    const beamPosAttr = beamSystem.geometry.attributes.position;
                    const beamArr = beamPosAttr.array;
                    for (let i = 0; i < beamCount; i++) {
                        const d = beamData[i];
                        d.progress += d.speed;
                        if (d.progress > 1 + d.delay * 0.01) d.progress = 0;
                        const t = Math.min(d.progress, 1);
                        const px = d.start.x + (d.end.x - d.start.x) * t;
                        const py = d.start.y + (d.end.y - d.start.y) * t;
                        const pz = d.start.z + (d.end.z - d.start.z) * t;
                        beamArr[i * 3] = px;
                        beamArr[i * 3 + 1] = py;
                        beamArr[i * 3 + 2] = pz;
                    }
                    beamPosAttr.needsUpdate = true;

                    // Parallax camera
                    camera.position.x += (mouseX * 0.4 - camera.position.x) * 0.02;
                    camera.position.y += (mouseY * 0.25 + 0.6 - camera.position.y) * 0.02;
                    camera.lookAt(0, 0, 0);

                    renderer.render(scene, camera);
                }
                animate();

                // ---- Điều khiển logo -> nội dung ----
                (function () {
                    const shell = document.getElementById("introShell");
                    setTimeout(() => {
                        if (shell) shell.classList.add("shifted");
                    }, 2000);
                })();

                // ---- Resize ----
                window.addEventListener("resize", () => {
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    renderer.setSize(w, h);
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                });
            })();
        </script>
    </body>
</html>
